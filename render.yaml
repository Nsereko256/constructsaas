services:
  - type: web
    name: constructsaas-web
    runtime: python
    buildCommand: pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python -m daphne -b 0.0.0.0 -p $PORT construction_saas.asgi:application
    healthCheckPath: /login
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: constructsaas-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: constructsaas-redis
          property: connectionString
      - key: DJANGO_CHANNEL_LAYER
        value: inmemory
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: FRONTEND_BASE_URL
        value: https://constructsaas-web.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://constructsaas-web.onrender.com
      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DJANGO_EMAIL_HOST
        sync: false
      - key: DJANGO_EMAIL_PORT
        value: "587"
      - key: DJANGO_EMAIL_HOST_USER
        sync: false
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_EMAIL_USE_TLS
        value: "true"

  - type: cron
    name: constructsaas-email-outbox
    runtime: python
    plan: starter
    schedule: "*/2 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py process_email_outbox
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: constructsaas-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: FRONTEND_BASE_URL
        value: https://constructsaas-web.onrender.com
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DJANGO_EMAIL_HOST
        sync: false
      - key: DJANGO_EMAIL_PORT
        value: "587"
      - key: DJANGO_EMAIL_HOST_USER
        sync: false
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_EMAIL_USE_TLS
        value: "true"
      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false

  - type: keyvalue
    name: constructsaas-redis
    ipAllowList: []

databases:
  - name: constructsaas-db
    databaseName: constructsaas
    user: constructsaas
