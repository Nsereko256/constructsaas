  /api/notifications/:
    get:
      operationId: notifications_list
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
      - in: query
        name: level
        schema:
          type: string
          enum:
          - danger
          - info
          - success
          - warning
        description: |-
          * `info` - Info
          * `success` - Success
          * `warning` - Warning
          * `danger` - Danger
      - in: query
        name: notification_type
        schema:
          type: string
          enum:
          - budget_approval_required
          - budget_threshold_reached
          - invoice_due_soon
          - invoice_match_exception
          - invoice_overdue
          - invoice_submitted
          - journal_posting_failure
          - low_stock
          - payment_approved
          - payment_awaiting_approval
          - payment_rejected
          - po_created
          - po_exceeding_budget
          - po_received
          - pr_approved
          - pr_rejected
          - pr_submitted
          - staff_advance_overdue
          - system
          - valuation_adjustment
        description: |-
          * `low_stock` - Low stock
          * `pr_submitted` - PR submitted
          * `pr_approved` - PR approved
          * `pr_rejected` - PR rejected
          * `po_created` - PO created
          * `po_received` - PO received
          * `system` - System
          * `budget_approval_required` - Budget approval required
          * `budget_threshold_reached` - Budget threshold reached
          * `po_exceeding_budget` - PO exceeding budget
          * `invoice_submitted` - Invoice submitted
          * `invoice_match_exception` - Invoice matching exception
          * `invoice_due_soon` - Invoice due soon
          * `invoice_overdue` - Invoice overdue
          * `payment_awaiting_approval` - Payment awaiting approval
          * `payment_approved` - Payment approved
          * `payment_rejected` - Payment rejected
          * `staff_advance_overdue` - Staff advance overdue
          * `valuation_adjustment` - Valuation adjustment
          * `journal_posting_failure` - Journal posting failure
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - notifications
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
