components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 255
        parent:
          type: integer
          nullable: true
        description:
          type: string
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        system_key:
          oneOf:
          - $ref: '#/components/schemas/SystemKeyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        allow_manual_posting:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_type
      - code
      - company
      - created_at
      - id
      - name
      - updated_at
    AccountMapping:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company:
          type: integer
          readOnly: true
        mapping_key:
          type: string
          maxLength: 50
        account:
          type: integer
        account_code:
          type: string
          readOnly: true
        account_name:
          type: string
          readOnly: true
        description:
          type: string
          maxLength: 255
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account
      - account_code
      - account_name
      - company
      - created_at
      - id
      - mapping_key
      - updated_at
    AccountMappingRequest:
      type: object
      properties:
        mapping_key:
          type: string
          minLength: 1
          maxLength: 50
        account:
          type: integer
        description:
          type: string
          maxLength: 255
        is_active:
          type: boolean
      required:
      - account
      - mapping_key
    AccountRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 255
        parent:
          type: integer
          nullable: true
        description:
          type: string
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        system_key:
          oneOf:
          - $ref: '#/components/schemas/SystemKeyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        allow_manual_posting:
          type: boolean
        is_active:
          type: boolean
      required:
      - account_type
      - code
      - name
    AccountTypeEnum:
      enum:
      - ASSET
      - LIABILITY
      - EQUITY
      - REVENUE
      - EXPENSE
      type: string
      description: |-
        * `ASSET` - Asset
        * `LIABILITY` - Liability
        * `EQUITY` - Equity
        * `REVENUE` - Revenue
        * `EXPENSE` - Expense
    AdvanceRetirement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        advance:
          type: integer
          readOnly: true
        expense_category:
          type: integer
          readOnly: true
        expense_category_name:
          type: string
          readOnly: true
        amount_spent:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        amount_refunded:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        total_retired:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        retirement_date:
          type: string
          format: date
          readOnly: true
        reason:
          type: string
          readOnly: true
        is_reversal:
          type: boolean
          readOnly: true
        reversal_of:
          type: integer
          readOnly: true
          nullable: true
        journal_entry:
          type: integer
          readOnly: true
          nullable: true
        retired_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - advance
      - amount_refunded
      - amount_spent
      - created_at
      - expense_category
      - expense_category_name
      - id
      - is_reversal
      - journal_entry
      - reason
      - retired_by
      - retirement_date
      - reversal_of
      - total_retired
    AllocationMethodEnum:
      enum:
      - QUANTITY
      - WEIGHT
      - MATERIAL_VALUE
      - EQUAL
      - MANUAL
      type: string
      description: |-
        * `QUANTITY` - Quantity
        * `WEIGHT` - Weight
        * `MATERIAL_VALUE` - Material value
        * `EQUAL` - Equal distribution
        * `MANUAL` - Manual allocation
