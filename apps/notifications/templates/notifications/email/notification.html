<!doctype html>
<html><body style="margin:0;background:#f3f6f6;font-family:Arial,sans-serif;color:#132f3a">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:28px 12px"><tr><td align="center">
    <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border:1px solid #dce5e6;border-radius:14px;overflow:hidden">
      <tr><td style="background:#0f777b;color:#fff;padding:18px 24px;font-size:18px;font-weight:700">ConstructSaaS</td></tr>
      <tr><td style="padding:26px 24px">
        <div style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:{% if requires_action %}#b85d00{% else %}#0f777b{% endif %}">{% if requires_action %}Action required{% else %}Operational update{% endif %}</div>
        <h1 style="font-size:22px;line-height:1.3;margin:8px 0 12px">{{ notification.title }}</h1>
        <p style="font-size:15px;line-height:1.6;color:#52666e;margin:0 0 22px">{{ notification.message }}</p>
        <a href="{{ action_url }}" style="display:inline-block;background:#0f777b;color:#fff;text-decoration:none;font-weight:700;padding:11px 18px;border-radius:8px">Open in ConstructSaaS</a>
      </td></tr>
      <tr><td style="padding:16px 24px;background:#f7f9f9;color:#6d7e84;font-size:12px">Sent for {{ company.name }}. Manage email preferences from Settings.</td></tr>
    </table>
  </td></tr></table>
</body></html>
